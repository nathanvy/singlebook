                state.document.assets[imported.id] = imported.asset
                editPage(page.id, { asset: imported.id })
                renderEditor()
                announce(`Embedded ${imported.asset.name}.`, 'dirty')
            }

            function renderPictureEditor(page) {
                const panel = element('section', { className: 'editor-panel' })
                panel.append(panelHeader('Picture page', page))
                const title = element('input', { type: 'text', value: page.title, dataset: { editorTitle: page.id } })
                const alt = element('input', { type: 'text', value: page.alt, disabled: page.decorative })
                const decorative = element('input', { type: 'checkbox', checked: page.decorative })
                const caption = element('textarea', { value: page.caption })
                const fit = element('select', {}, element('option', { value: 'contain', text: 'Contain — show the whole image' }), element('option', { value: 'cover', text: 'Cover — crop to fill' }))
                fit.value = page.fit
                const preview = element('div', { className: 'preview-pane', role: 'region', 'aria-label': 'Reader preview' })
                updatePreview(preview, page)
                const currentAsset = assetFor(page.asset)
                const replace = element('button', { text: currentAsset ? 'Replace image…' : 'Choose image…', onclick: () => replacePictureAsset(page) })
                const assetCard = element('div', { className: 'asset-card' })
                assetCard.append(currentAsset ? element('img', { src: currentAsset.data, alt: '' }) : renderMissingAsset('No image selected.'))
                assetCard.append(element('div', { className: 'form-stack' }, assetDetails(currentAsset), replace))

                title.addEventListener('input', () => { editPage(page.id, { title: title.value }); updateRailLabel(page); updatePreview(preview, page) })
                alt.addEventListener('input', () => { editPage(page.id, { alt: alt.value }); updatePreview(preview, page) })
                decorative.addEventListener('change', () => { editPage(page.id, { decorative: decorative.checked }); alt.disabled = decorative.checked; updatePreview(preview, page) })
                caption.addEventListener('input', () => { editPage(page.id, { caption: caption.value }); updatePreview(preview, page) })
                fit.addEventListener('change', () => { editPage(page.id, { fit: fit.value }); updatePreview(preview, page) })

                const decorativeLabel = element('label', { className: 'inline-actions' }, decorative, element('span', { text: 'This image is decorative' }))
                panel.append(
                    element('div', { className: 'settings-card form-stack' },
                        labeledField('Page title', title), assetCard,
                        labeledField('Image description (alt text)', alt, 'Describe meaningful content for readers who cannot see the image.'),
                        decorativeLabel,
                        labeledField('Caption (optional)', caption), labeledField('Image fit', fit)
                    ), preview
                )
                return panel
            }

            async function replaceCoverAsset() {
                const imported = await importRasterImage()
                if (!imported) return
                state.document.assets[imported.id] = imported.asset
                changeBook({ coverAsset: imported.id })
                renderEditor()
                announce(`Embedded ${imported.asset.name} as the cover.`, 'dirty')
            }

            function renderBookSettings() {
                const book = state.document.book
                const panel = element('section', { className: 'editor-panel' })
                panel.append(panelHeader('Book settings'))
                const title = element('input', { type: 'text', value: book.title })
                const subtitle = element('input', { type: 'text', value: book.subtitle })
                const author = element('input', { type: 'text', value: book.author })
                const language = element('input', { type: 'text', value: book.language, pattern: '[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*' })
                const description = element('textarea', { value: book.description })
                const accent = element('input', { type: 'color', value: book.accent })
                const coverAlt = element('input', { type: 'text', value: book.coverAlt, disabled: book.coverDecorative })
                const coverDecorative = element('input', { type: 'checkbox', checked: book.coverDecorative })
                const cover = assetFor(book.coverAsset)
                const coverCard = element('div', { className: 'asset-card' })
                coverCard.append(cover ? element('img', { src: cover.data, alt: '' }) : renderMissingAsset('No cover image selected.'))
                const coverActions = element('div', { className: 'form-stack' }, assetDetails(cover))
                const replace = element('button', { text: cover ? 'Replace cover…' : 'Choose cover…', onclick: replaceCoverAsset })
                coverActions.append(replace)
                if (cover) {
                    const remove = element('button', { className: 'danger', text: 'Remove cover', onclick: () => { changeBook({ coverAsset: '' }); renderEditor(); announce('Cover removed.', 'dirty') } })
                    coverActions.append(remove)
                }
                coverCard.append(coverActions)

                title.addEventListener('input', () => {
                    changeBook({ title: title.value })
                    document.querySelector('.app-title').textContent = title.value || 'Untitled book'
                    applyTheme()
                })
                subtitle.addEventListener('input', () => changeBook({ subtitle: subtitle.value }))
                author.addEventListener('input', () => changeBook({ author: author.value }))
                language.addEventListener('input', () => {
                    if (isLanguageTag(language.value)) {
                        language.setCustomValidity('')
                        changeBook({ language: language.value })
                        applyTheme()
                    } else {
                        language.setCustomValidity('Use a language tag such as en or en-CA.')
                    }
                })
                description.addEventListener('input', () => changeBook({ description: description.value }))
                accent.addEventListener('input', () => {
                    if (!isHexColor(accent.value)) return
                    changeBook({ accent: accent.value })
                    applyTheme()
                })
                coverAlt.addEventListener('input', () => changeBook({ coverAlt: coverAlt.value }))
                coverDecorative.addEventListener('change', () => {
                    changeBook({ coverDecorative: coverDecorative.checked })
                    coverAlt.disabled = coverDecorative.checked
                })

                const settings = element('div', { className: 'settings-card settings-grid' },
                    labeledField('Title', title), labeledField('Subtitle', subtitle),
                    labeledField('Author', author), labeledField('Language', language, 'Use a language tag such as en or en-CA.'),
                    element('div', { className: 'wide' }, labeledField('Description', description)),
                    labeledField('Accent color', accent),
                    element('div', { className: 'field' }, element('span', { className: 'field-label', text: 'Theme' }), element('p', { className: 'field-hint', text: 'Paper — the first release includes one carefully tested theme.' })),
                    element('div', { className: 'wide' }, element('span', { className: 'field-label', text: 'Cover image' }), coverCard),
                    element('div', { className: 'wide' }, labeledField('Cover image description', coverAlt)),
                    element('label', { className: 'inline-actions wide' }, coverDecorative, element('span', { text: 'The cover is decorative' }))
                )
                panel.append(settings)
                return panel
            }

            function renderEditor() {
                state.ui.mode = 'editor'
                const shell = element('div', { className: 'editor-app' })
                const body = element('div', { className: 'editor-body' })
                body.append(renderPageRail())
                const main = element('section', { className: 'editor-main', 'aria-label': 'Editor' })
                const page = currentPage()
                if (!page) main.append(renderBookSettings())
                else if (page.type === 'section') main.append(renderSectionEditor(page))
                else if (page.type === 'picture') main.append(renderPictureEditor(page))
                else main.append(renderTextEditor(page))
                body.append(main)
                shell.append(editorHeader(), body)
                replaceContents(app, shell)
                requestAnimationFrame(() => refreshSaveStatus(false))
            }

            function enterEditMode() {
                const route = parseRoute()
                if (route.kind === 'page' && pageIndex(route.id) >= 0) state.ui.selectedPageId = route.id
                else if (!state.ui.selectedPageId) state.ui.selectedPageId = state.document.pages[0]?.id || null
                renderEditor()
                focusMain()
            }

            function leaveEditMode() {
                const selected = state.ui.selectedPageId
                state.ui.mode = 'reader'
                if (selected) navigate(`#page/${encodeURIComponent(selected)}`)
                else navigate('#cover')
                renderReader()
                focusMain()
            }

            function readFileAsDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader()
                    reader.addEventListener('load', () => resolve(String(reader.result)))
                    reader.addEventListener('error', () => reject(reader.error || new Error('The image could not be read.')))
                    reader.readAsDataURL(file)
                })
            }

            function decodeImage(data) {
                return new Promise((resolve, reject) => {
                    const image = new Image()
                    image.addEventListener('load', () => resolve(image), { once: true })
                    image.addEventListener('error', () => reject(new Error('The selected file is not a decodable image.')), { once: true })
                    image.src = data
                })
            }

            function chooseImageFile() {
                return new Promise(resolve => {
                    const input = element('input', {
                        type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp,image/avif',
                        className: 'visually-hidden', 'data-singlebook-transient': 'true'
                    })
                    let settled = false
                    const finish = file => {
                        if (settled) return
                        settled = true
                        input.remove()
                        resolve(file || null)
                    }
                    input.addEventListener('change', () => finish(input.files?.[0]))
                    input.addEventListener('cancel', () => finish(null))
                    document.body.append(input)
                    input.click()
                })
            }

            async function importRasterImage() {
                const file = await chooseImageFile()
                if (!file) return null
                if (!ALLOWED_IMAGE_TYPES.has(file.type)) {
                    announce('Choose a PNG, JPEG, GIF, WebP, or AVIF image. SVG is not accepted.', 'error')
                    return null
                }
                if (file.size > 10 * 1024 * 1024 && !window.confirm(`${file.name} is ${formatBytes(file.size)} and will make every copy of the book larger. Embed it anyway?`)) return null
                try {
                    const data = await readFileAsDataUrl(file)
                    if (!data.toLowerCase().startsWith(`data:${file.type.toLowerCase()};base64,`)) throw new Error('The image data did not match its declared type.')
                    await decodeImage(data)
                    return { id: createId('asset'), asset: { name: file.name, mime: file.type, data } }
                } catch (error) {
                    announce(error.message || 'The image could not be embedded.', 'error')
                    return null
                }
            }

            function collectAssetReferences(doc) {
                const references = new Set()
                if (doc.book.coverAsset) references.add(doc.book.coverAsset)
                for (const page of doc.pages) {
                    if (page.type === 'picture' && page.asset) references.add(page.asset)
                    if (page.type === 'text') {
                        const withoutCode = page.markdown
                            .replace(/```[\s\S]*?```/g, '')
                            .replace(/`[^`\n]*`/g, '')
                        const pattern = /!\[[^\]]*\]\(asset:([A-Za-z0-9._~-]+)\)/g
                        let match
                        while ((match = pattern.exec(withoutCode))) references.add(match[1])
                    }
                }

                const assetIds = Object.keys(doc.assets)
                const scanUnknownValue = value => {
                    if (typeof value === 'string') {
                        for (const id of assetIds) if (value.includes(`asset:${id}`)) references.add(id)
                    } else if (Array.isArray(value)) {
                        value.forEach(scanUnknownValue)
                    } else if (isPlainObject(value)) {
                        Object.values(value).forEach(scanUnknownValue)
                    }
                }
                const rootKnown = new Set(['format', 'version', 'id', 'book', 'pages', 'assets'])
                for (const [key, value] of Object.entries(doc)) if (!rootKnown.has(key)) scanUnknownValue(value)
                const bookKnown = new Set(['title', 'subtitle', 'author', 'language', 'description', 'coverAsset', 'coverAlt', 'coverDecorative', 'theme', 'accent', 'createdAt', 'updatedAt'])
                for (const [key, value] of Object.entries(doc.book)) if (!bookKnown.has(key)) scanUnknownValue(value)
                for (const page of doc.pages) {
                    const known = new Set(page.type === 'text'
                        ? ['id', 'type', 'title', 'markdown']
                        : page.type === 'section'
                            ? ['id', 'type', 'title', 'subtitle']
                            : ['id', 'type', 'title', 'asset', 'alt', 'caption', 'decorative', 'fit'])
                    for (const [key, value] of Object.entries(page)) if (!known.has(key)) scanUnknownValue(value)
                }
                return references
            }

            function prepareDocumentForSave(doc) {
                const copy = deepClone(doc)
                const references = collectAssetReferences(copy)
                for (const [id, asset] of Object.entries(copy.assets)) {
                    if (isSafeAsset(asset) && !references.has(id)) delete copy.assets[id]
                }
                return copy
            }

            function countLiteral(source, needle) {
                let count = 0
                let offset = 0
                while ((offset = source.indexOf(needle, offset)) >= 0) {
                    count += 1
                    offset += needle.length
                }
                return count
            }

            function serializeFile(doc) {
                const prepared = prepareDocumentForSave(doc)
                const clone = pristineDocument.cloneNode(true)
                clone.querySelectorAll('[data-singlebook-transient]').forEach(node => node.remove())
                const blocks = clone.querySelectorAll(`#${DATA_BLOCK_ID}`)
                if (blocks.length !== 1) throw new Error(`Expected one #${DATA_BLOCK_ID} block; found ${blocks.length}.`)
                const json = JSON.stringify(prepared, null, 2).replace(/</g, '\\u003c')
                blocks[0].textContent = `\n${json}\n  `
                clone.documentElement.lang = prepared.book.language
                const title = clone.querySelector('title')
                if (title) title.textContent = `${prepared.book.title || 'Untitled book'} — singlebook`
                const generator = clone.querySelector('meta[name="generator"]')
                if (generator) generator.setAttribute('content', `singlebook ${APP_VERSION}`)
                const html = `<!doctype html>\n${clone.documentElement.outerHTML}`
                const expectedScripts = clone.querySelectorAll('script').length
                const actualClosers = countLiteral(html.toLowerCase(), SCRIPT_CLOSE)
                if (actualClosers !== expectedScripts) throw new Error('Serialization safety check found an unexpected script closing tag.')

                const verification = new DOMParser().parseFromString(html, 'text/html')
                const verifyBlocks = verification.querySelectorAll(`#${DATA_BLOCK_ID}`)
                if (verifyBlocks.length !== 1) throw new Error('The serialized file did not retain exactly one document block.')
                const roundTrip = JSON.parse((verifyBlocks[0].textContent || '').trim())
                if (JSON.stringify(roundTrip) !== JSON.stringify(prepared)) throw new Error('The serialized document failed its round-trip check.')
                return { html, prepared }
            }

            async function pickSaveHandle(doc) {
                try {
                    return await window.showSaveFilePicker({
                        id: 'singlebook-document',
                        suggestedName: state.persistence.fileName || openedFileName() || suggestedFileName(doc),
                        types: [{ description: 'singlebook HTML', accept: { 'text/html': ['.singlebook.html'] } }]
                    })
                } catch (error) {
                    if (error && error.name === 'AbortError') return null
                    throw error
                }
            }

            async function writeHandle(handle, html) {
                const writable = await handle.createWritable()
                try {
                    await writable.write(new Blob([html], { type: 'text/html' }))
                    await writable.close()
                } catch (error) {
                    try { await writable.abort?.() } catch (_) {}
                    throw error
                }
            }

            function downloadHtml(html, name) {
                const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }))
                const anchor = element('a', { href: url, download: name, 'data-singlebook-transient': 'true' })
                document.body.append(anchor)
                anchor.click()
                anchor.remove()
                setTimeout(() => URL.revokeObjectURL(url), 5000)
            }

            function temporaryPersistenceMessage(message, tone = 'saved') {
                state.persistence.message = message
                state.persistence.messageTone = tone
                refreshSaveStatus(true)
                setTimeout(() => {
                    if (!state || state.persistence.message !== message) return
                    state.persistence.message = ''
                    state.persistence.messageTone = ''
                    refreshSaveStatus(false)
                }, 5000)
            }

            function confirmAccessibleImagesBeforeSave() {
                const missing = []
                const book = state.document.book
                if (book.coverAsset && !book.coverDecorative && !book.coverAlt.trim()) missing.push('the cover')
                for (const page of state.document.pages) {
                    if (page.type === 'picture' && page.asset && !page.decorative && !page.alt.trim()) {
                        missing.push(`“${page.title || 'Untitled picture'}”`)
                    }
                    if (page.type === 'text' && /!\[\s*\]\(asset:[A-Za-z0-9._~-]+\)/.test(page.markdown)) {
                        missing.push(`an inline image on “${page.title || 'Untitled page'}”`)
                    }
                }
                if (!missing.length) return true
                return window.confirm(`The following image${missing.length === 1 ? ' has' : 's have'} no description: ${missing.join(', ')}.\n\nSave anyway?`)
            }

            async function saveDocument() {
                if (state.persistence.saving) return
                if (!confirmAccessibleImagesBeforeSave()) {
                    announce('Save cancelled. Add image descriptions or mark decorative images.', 'error', true)
                    return
                }
                state.persistence.saving = true
                state.persistence.error = ''
                state.persistence.message = ''
                state.persistence.messageTone = ''
                refreshSaveStatus(true)
                const revision = state.persistence.revision
                let outcome = ''
                let outcomeTone = 'saved'
                try {
                    const serialized = serializeFile(state.document)
                    if (canWriteInPlace()) {
                        let handle = state.persistence.fileHandle
                        if (!handle) handle = await pickSaveHandle(serialized.prepared)
                        if (!handle) {
                            outcome = 'Save cancelled.'
                            outcomeTone = 'neutral'
                            return
                        }
                        await writeHandle(handle, serialized.html)
                        state.persistence.fileHandle = handle
                        state.persistence.fileName = handle.name
                        state.persistence.persistedRevision = revision
                        outcome = `Saved to ${handle.name}.`
                    } else {
                        const name = suggestedFileName(serialized.prepared)
                        downloadHtml(serialized.html, name)
                        state.persistence.persistedRevision = revision
                        outcome = 'Updated copy downloaded; the open file was not changed.'
                    }
                } catch (error) {
                    console.error(error)
                    state.persistence.error = `Save failed: ${error.message || 'Unknown error'}`
                } finally {
                    state.persistence.saving = false
                    if (outcome) temporaryPersistenceMessage(outcome, outcomeTone)
                    else refreshSaveStatus(true)
                }
            }

            // 10. Fatal recovery
            function renderFatal(error) {
                if (splash) splash.remove()
                document.getElementById('singlebook-save-notice')?.remove()
                const copy = element('button', {
                    text: 'Copy raw document JSON', onclick: async () => {
                        await copyText(rawEmbeddedText)
                        announce('Raw document JSON copied.', 'saved')
                    }
                })
                const reload = element('button', { text: 'Reload file', onclick: () => location.reload() })
                const raw = element('textarea', { className: 'raw-json', value: rawEmbeddedText, readOnly: true, 'aria-label': 'Raw document JSON' })
                replaceContents(app, element('section', { className: 'fatal-screen' },
                    element('p', { className: 'cover-kicker', text: 'singlebook could not open' }),
                    element('h1', { text: 'This book needs attention' }),
                    element('p', { text: 'The editor did not change the file. You can copy its raw document data before trying a newer editor or repairing the JSON.' }),
                    element('p', { className: 'fatal-details', text: error.message || String(error) }),
                    element('div', { className: 'inline-actions' }, copy, reload), raw
                ))
                app.focus()
            }

            // 11. Boot and global events
            function boot() {
                try {
                    const normalized = normalizeDocument(readEmbeddedDocument())
                    state = {
                        document: normalized.document,
                        warnings: normalized.warnings,
                        ui: {
                            mode: 'reader',
                            selectedPageId: normalized.document.pages[0]?.id || null,
                            editorTab: 'write',
                            railOpen: false
                        },
                        persistence: {
                            revision: 0,
                            persistedRevision: 0,
                            saving: false,
                            fileHandle: null,
                            fileName: openedFileName(),
                            error: '',
                            message: '',
                            messageTone: ''
                        }
                    }
                    applyTheme()
                    if (splash) splash.remove()
                    renderReader()
                    noticeIfCannotWriteInPlace()
                    if (normalized.warnings.length) {
                        console.warn('singlebook document warnings:', normalized.warnings)
                        requestAnimationFrame(() => announce(`${normalized.warnings.length} document warning${normalized.warnings.length === 1 ? '' : 's'}; details are in the browser console.`, 'error'))
                    }
                } catch (error) {
                    console.error(error)
                    renderFatal(error)
                }
            }

            window.addEventListener('hashchange', () => {
                if (!state || state.ui.mode !== 'reader') return
                renderReader()
                focusMain()
            })

            window.addEventListener('keydown', event => {
                if (!state) return
                if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
                    event.preventDefault()
                    saveDocument()
                    return
                }
                if (state.ui.mode !== 'reader' || event.metaKey || event.ctrlKey || event.altKey || isTextEntryTarget(event.target)) return
                if (event.key === 'ArrowRight') navigateRelative(1)
                if (event.key === 'ArrowLeft') navigateRelative(-1)
            })

            window.addEventListener('beforeunload', event => {
                if (!state || !isDirty()) return
                event.preventDefault()
                event.returnValue = ''
            })

            boot()
        })()
    </script></body></html>
