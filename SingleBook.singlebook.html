      "id": "page-welcome",
      "type": "text",
      "title": "Welcome to SingleBook",
      "markdown": "SingleBook is a complete ebook **and** its editor in one readable, portable HTML file. It needs no account, server, build step, or internet connection.\n\nThis copy is both a manual and a working showcase. You can read it from beginning to end, or jump straight to:\n\n- [Start a book](#page/page-start)\n- [Text Pages](#page/page-text-showcase)\n- [Section Pages](#page/page-section-showcase)\n- [Picture Pages](#page/page-picture-showcase)\n- [Saving differences between browsers](#page/page-saving)\n\nChoose **Edit** in the header whenever you are ready to inspect the controls or make this copy your own. Everything you change remains in memory until you save."
    },
    {
      "id": "page-essentials",
      "type": "section",
      "title": "Part I · The essentials",
      "subtitle": "Start, read, edit, save"
    },
    {
      "id": "page-start",
      "type": "text",
      "title": "Start a book",
      "markdown": "SingleBook does not require installation.  It's just a file that you can share, edit, copy, and do pretty much whatever you please with.\n\n1. Copy `SingleBook.singlebook.html`.\n2. Rename the copy to something like `my-novel.singlebook.html`.\n3. Open the copy in a modern browser with JavaScript enabled.\n4. Choose **Edit**, replace this demo content, and choose **Save**.\n\nThe `.singlebook.html` ending is merely a convention, not a special file format.\n\n## Pro tip:\n> Keep an untouched copy of the original file nearby. It is both a clean template and an easy way to recover the reader/editor shell.\n"
    },
    {
      "id": "page-reading",
      "type": "text",
      "title": "Reading a SingleBook",
      "markdown": "Every book opens in reader mode. The **Cover** introduces the book, while **Contents** lists every page and identifies its type. Those two pages receive special processing.  Previous, next, and Contents links appear below each page.\n\nWhen focus is not inside a button, link, or form control, you can use the **Left Arrow** and **Right Arrow** keys to move through pages. The left arrow from the first page returns to the cover.\n\nEach page also has a stable address ending in `#page/page-id`. Bookmark it, copy it, or use it for a link elsewhere in the same book. Reordering a page does not change that address.\n\nTry a real internal link: [return to the welcome page](#page/page-welcome)."
    },
    {
      "id": "page-editing",
      "type": "text",
      "title": "Editing a SingleBook",
      "markdown": "Choose **Edit** to open the page rail and editor. Select a page in the rail, move it with the arrow buttons, or use **+ Add page** to create a text, section, or picture page. **Book settings** controls the cover, metadata, language, and accent color.\n\nText pages offer **Write** and **Preview** tabs plus a small formatting toolbar. Native browser undo and redo work while you are typing. Titles, settings, order, and page content update the in-memory book immediately.\n\nThe status in the header distinguishes a clean book from **Unsaved changes**. Choose **Reader** at any time to see the selected page in its final reading layout; switching modes does not save the file.\n\nDeleting a page asks for confirmation. If it is the only page, SingleBook keeps its stable ID and turns it into a blank text page instead."
    },
    {
      "id": "page-saving",
      "type": "text",
      "title": "Saving your book",
      "markdown": "The action is always **Save**. You can also press **Command-S** on macOS or **Ctrl-S** elsewhere; SingleBook prevents the browser’s normal Save Page dialog.\n\nIn Chrome, Edge, and other browsers that expose direct file access, the first save asks where to put the `.singlebook.html` file. Later saves in that browser session update the approved file directly.\n\nIn Firefox, Safari, and other browsers without direct file access, Save downloads a new complete copy. **The file currently open does not change.** This is a limitation of those browsers.  Open the newest download before you continue editing, and replace or archive the older copy deliberately. \n\nBefore writing, SingleBook warns about meaningful images without descriptions. It then serializes the complete app and book, removes unused embedded images, and checks that the document data survives a round trip. A saved copy still contains the reader, editor, and current book."
    },
    {
      "id": "page-types",

      "title": "Part II · Page types",
      "subtitle": ""

    {
      "id": "page-text-showcase",
      "type": "text",
      "title": "The text page",
      "markdown": "A text page is a regular page: a title followed by long-form writing in SingleBook’s supported subset of Markdown. This page is a text page. \n\n## Typography in practice\n\nUse **bold** for strong emphasis, _italics_ for a change of voice, ~~strikethrough~~ for a visible correction, and `inline code` for literal names or short commands.\n\nSinglebook supports block quotes:\n\n> Do or do not.  There is no try.  - Gandalf\n\nLists can be unordered:\n\n- one self-contained file\n- a reader and editor\n  - with an immediate preview\n- no required network\n\nOr ordered:\n\n1. write\n2. preview\n3. save\n\n---\n\nHeadings, prose, quotes, lists, code, links, and inline images all belong comfortably on a text page. [The full Markdown reference is later in this guide.](#page/page-markdown)"
    },

      "id": "page-writing",

      "title": "Part III · Writing tools",
      "subtitle": "Markdown, links, and images"

    {
      "id": "page-markdown",
      "type": "text",
      "title": "The Markdown reference",
      "markdown": "SingleBook intentionally supports a small subset of Markdown. A page title is separate from its Markdown body. Inside the body, use headings from `#` through `####`.\n\n## Inline formatting\n\n```markdown\n**bold**  _italic_  ~~strikethrough~~  `inline code`\n[link label](https://example.com)\n```\n\nA backslash escapes the next formatting character. Two spaces before a newline make a hard line break; otherwise adjacent lines in a paragraph flow together.\n\n## Blocks\n\n```markdown\n## Heading\n\n> Quoted text\n\n- bullet\n  - indented bullet\n\n1. numbered item\n2. another item\n\n---\n```\n\nTriple-backtick fences make code blocks; add a short language label after the opening fence when useful. SingleBook preserves that label for semantics but does not add syntax highlighting.\n\nBlank lines separate paragraphs. Tables, task lists, footnotes, raw HTML, and arbitrary embedded media are outside the supported subset. Unsupported markup remains ordinary text whenever possible but might have unintended layout effects."
    },
    {
      "id": "page-links",
      "type": "text",
      "title": "Links and navigation",
      "markdown": "The link tool accepts three kinds of destination:\n\n- `https://` or `http://` web addresses\n- `mailto:` email addresses\n- `#page/…` links to pages in this book\n\nWeb and email links open outside the book with some protections against the new page controlling this one. \n\nFor an internal link, use the stable ID visible at the end of the destination page’s address. This page is `#page/page-links`. Renaming or moving it keeps that link valid. Deleting it does not.\n\nExample: [jump to the picture-page showcase](#page/page-picture-showcase)."
    },
    {
      "id": "page-images",
      "type": "text",
      "title": "Images",
      "markdown": "SingleBook accepts PNG, JPEG, GIF, WebP, and AVIF images. It rejects SVG and remote image URLs. Imported images are stored as data inside the book, so every copy remains portable and offline. Very large files make every saved copy larger; images above 10 MB trigger an extra confirmation.\n\n\"Picture Page\" type pages are intended for one dominant image.  The book cover can also have an image.  For an illustration inside the prose you can use the markdown inline image feature:\n\n![That same Crappy ChatGPT image of a book](asset:asset-showcase-book)"
    },
    {
      "id": "page-portable",
      "type": "section",
      "title": "Part IV · Keeping and sharing",
      "subtitle": "Portable by design"
    },
    {
      "id": "page-offline",
      "type": "text",
      "title": "Offline by design",
      "markdown": "A SingleBook has no external scripts, styles, fonts, frames, images, analytics, or network client. Its Content Security Policy blocks network connections and treats the file as a closed package. Once you have the file, reading and editing do not depend on a service staying online, so in theory a SimpleBook book should remain readable for as long as browsers support HTML.\n\nImages must be supported raster formats, stored as data in the document.\n\nSingleBook explicitly does not support encryption or DRM. Anyone with the file can read its source and use the included editor.  Singlebook offers no Sharing feature.  It's just a file, so you can email it, print it, etc."
    },
    {
      "id": "page-makers",
      "type": "section",
      "title": "Part V · Under the cover",
      "subtitle": "For hackers and maintainers"
    },
    {
      "id": "page-inside",
      "type": "text",
      "title": "What lives in this file",
      "markdown": "The source is deliberately readable. Near the top, one JSON block stores the book metadata, ordered pages, and embedded assets. The rest of the document contains the styles and unminified JavaScript for the reader, editor, validation, and saving workflow.\n\nThe document declares a format name and version so future editors can recognize compatibility. Every page has a stable ID. Assets have IDs too, letting the cover, picture pages, and text pages reuse the same embedded image.\n\nWhen saving, SingleBook starts from a clean clone of its own document rather than copying the live interface. Temporary dialogs, notices, and editor state are not written into the book. The current document data is serialized back into its single designated block."
    },
    {
      "id": "page-hacking",
      "type": "text",
      "title": "Hacking on SingleBook",
      "markdown": "The repository's `SingleBook.singlebook.html` is the canonical source: feel free to edit it directly, add features or custom page types, etc. There is no generated version, dependency manager, framework, or build pipeline.  \n\nIf you are not a hacker type, ask your friendly local AI model for advice getting started."
    }

    <style>
        :root {
            color-scheme: light;
            --paper: #f8f4ea;
            --paper-raised: #fffdf7;
            --paper-deep: #eee7d8;
            --ink: #24221e;
            --ink-soft: #666158;
            --ink-faint: #8b857a;
            --accent: #9b3a32;
            --accent-ink: #ffffff;
            --border: #d8d0c1;
            --border-strong: #b8ad9c;
            --danger: #9a2721;
            --success: #346744;
            --focus: #1769aa;
            --shadow: 0 18px 60px rgba(42, 34, 22, 0.12);
            --shadow-small: 0 5px 18px rgba(42, 34, 22, 0.1);
            --radius: 0.75rem;
            --radius-small: 0.45rem;
            --measure: 68ch;
            --serif: ui-serif, Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
            --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }
    
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
    
        html {
            min-height: 100%;
            background: var(--paper);
            scroll-behavior: smooth;
        }
    
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 30rem),
                var(--paper);
            font-family: var(--sans);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
    
        button,
        input,
        textarea,
        select {
            font: inherit;
        }
    
        button,
        .button {
            min-height: 2.75rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-small);
            padding: 0.58rem 0.9rem;
            color: var(--ink);
            background: var(--paper-raised);
            font-weight: 650;
            line-height: 1.15;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset;
        }
    
        button:hover,
        .button:hover {
            border-color: var(--ink-soft);
        }
    
        button:active,
        .button:active {
            transform: translateY(1px);
        }
    
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
    
        button.primary {
            color: var(--accent-ink);
            border-color: var(--accent);
            background: var(--accent);
        }
    
        button.quiet {
            border-color: transparent;
            background: transparent;
            box-shadow: none;
        }
    
        button.danger {
            color: var(--danger);
        }
    
        button.danger.primary {
            color: #fff;
            background: var(--danger);
            border-color: var(--danger);
        }
    
        a {

            .editor-body {
                grid-template-columns: 1fr;
                height: calc(100vh - 6.2rem);
            }
    
            .page-rail {
                display: none;
                position: fixed;
                z-index: 30;
                inset: 6rem 0 0;
                border-right: 0;
            }
    
            .page-rail.open {
                display: block;
            }
    
            .mobile-only {
                display: inline-flex;
            }
    
            .writing-layout {
                grid-template-columns: 1fr;
            }
    
            .editor-tabs {
                display: flex;
                gap: .25rem;
                margin-bottom: .6rem;
            }
    
            .writing-layout[data-tab="write"] .preview-pane {
                display: none;
            }
    
            .writing-layout[data-tab="preview"] .writing-pane {
                display: none;
            }
    
            .settings-grid {
                grid-template-columns: 1fr;
            }
    
            .settings-grid .wide {
                grid-column: auto;
            }
    
            .asset-card {
                grid-template-columns: 1fr;
            }
        }
    
        @media (max-width: 540px) {
            .header-actions {
                width: 100%;
                overflow-x: auto;
                padding-bottom: .1rem;
            }
    
            .app-title {
                width: 100%;
                flex-basis: 100%;
            }
    
            .save-capability-banner {
                top: calc(9.25rem + env(safe-area-inset-top, 0px));
                width: calc(100vw - 1rem - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
                max-width: none;
                align-items: flex-start;
            }
    
            .reader-surface {
                width: min(calc(100% - 1.35rem), 58rem);
                padding-top: 2.5rem;
            }
    
            .book-cover {
                width: min(calc(100% - 1.35rem), 70rem);
            }
    
            .page-navigation {
                grid-template-columns: 1fr 1fr;
                width: min(calc(100% - 1.35rem), 58rem);
            }
    
            .page-navigation .contents {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-self: center;
            }
    
            .editor-main {
                padding: .75rem;
            }
    
            .editor-panel-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    
        @media (prefers-reduced-motion: reduce) {
    
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .001ms !important;
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    
        @media (forced-colors: active) {
    
            button,
            input,
            textarea,
            select,
            dialog,
            .writing-pane,
            .preview-pane,
            .settings-card,
            .save-capability-banner {
                border: 1px solid CanvasText;
            }
    
            :focus-visible {
                outline-color: Highlight;
            }
        }
    
        @media print {
    
            .app-header,
            .page-navigation,
            .skip-link,
            .save-capability-banner,
            #singlebook-live-status {
                display: none !important;
            }
    
            html,
            body {
                background: #fff;
            }
    
            .reader-surface {
                width: auto;
                margin: 0;
                padding: 0;
            }
    
            .book-page {
                max-width: none;
            }
    
            a {
                color: inherit;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#singlebook-app">Skip to book</a>
    <div id="singlebook-splash" role="status">Opening book...</div>
    <main id="singlebook-app" tabindex="-1"></main>
    <div id="singlebook-live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <noscript>
        &amp;lt;p&amp;gt;This book contains its own reader and requires JavaScript enabled to open.&amp;lt;/p&amp;gt;
    </noscript>
    <script>
        (() => {
            'use strict'
            // the live DOM is disposable ui
            // the clone is the application shell that gets written back to disk
            const pristineDocument = document.cloneNode(true)

            const FORMAT = 'singlebook'
            const FORMAT_VERSION = 1
            const APP_VERSION = '0.1.1'
            const DATA_BLOCK_ID = 'singlebook-data'
            const SAVE_NOTICE_KEY = 'singlebook-save-notice'
            const ALLOWED_IMAGE_TYPES = new Set([
                'image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/avif'
            ])

            // html gets parsed/rendered first so if we use a literal script tag it will fuck everything up
            const SCRIPT_CLOSE = '</scr' + 'ipt>'

            const app = document.getElementById('singlebook-app')
            const splash = document.getElementById('singlebook-splash')
            const liveStatus = document.getElementById('singlebook-live-status')
            let rawEmbeddedText = ''
            let state = null
            let saveNoticeAcknowledged = false

            function isPlainObject(value) {
              if (!value || Object.prototype.toString.call(value) !== '[object Object]'){
                return false
              }
              const proto = Object.getPrototypeOf(value)
              return proto === Object.prototype || proto === null
            }

            function deepClone(value) {
              if (typeof structuredClone === 'function'){
                return structuredClone(value)
              }
              return JSON.parse(JSON.stringify(value))
            }

            function createId(prefix) {
              if (crypto.randomUUID){
                return `${prefix}-${crypto.randomUUID()}`
              }
              const bytes = new Uint8Array(16)
              crypto.getRandomValues(bytes)
              return `${prefix}-${Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('')}`
            }

            function nowISO() { return new Date().toISOString() }

            function canWriteInPlace() {
                return typeof window.showSaveFilePicker === 'function'
            }

            function isMacOS() {
                const platform = String(navigator.userAgentData?.platform || navigator.platform || '')
                const userAgent = String(navigator.userAgent || '')
                if (/iPhone|iPad|iPod/i.test(userAgent)) return false
                if (!/^Mac/i.test(platform)) return false
                return !(platform === 'MacIntel' && Number(navigator.maxTouchPoints) > 1)
            }

            function saveShortcutLabel() {
                return isMacOS() ? '⌘S' : 'Ctrl+S'
            }

            function hasAcknowledgedSaveNotice() {
                if (saveNoticeAcknowledged) return true
                try {
                    return localStorage.getItem(SAVE_NOTICE_KEY) === 'seen'
                } catch (_) {
                    return false
                }
            }

            function acknowledgeSaveNotice() {
                saveNoticeAcknowledged = true
                try { localStorage.setItem(SAVE_NOTICE_KEY, 'seen') } catch (_) {}
            }

            function saveTooltip() {
                const shortcut = saveShortcutLabel()
                if (!canWriteInPlace()) {
                    return `Save.  This browser can't edit files in place so ${shortcut} will download an updated copy.`
                }
                if (state?.persistence.fileHandle) return `Save (${shortcut})`
                return `Save (${shortcut}) — choose a file.`
            }

            function isHexColor(value) {
                return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)
            }

            function isLanguageTag(value) {
                return typeof value === 'string' && /^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i.test(value)
            }

            function isSafeAsset(asset) {
                return isPlainObject(asset) &&
                    typeof asset.name === 'string' &&
                    ALLOWED_IMAGE_TYPES.has(asset.mime) &&
                    typeof asset.data === 'string' &&
                    asset.data.toLowerCase().startsWith(`data:${asset.mime.toLowerCase()};base64,`)
            }

            function safeFileBase(title) {
                const base = String(title || '')
                    .normalize('NFKC')
                    .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ')
                    .replace(/\s+/g, '_')
                    .replace(/^[_ .-]+|[_ .-]+$/g, '')
                    .slice(0, 100)
                return base || 'Untitled'
            }

            function suggestedFileName(doc) {
                return `${safeFileBase(doc.book.title)}.singlebook.html`
            }

            function openedFileName() {
                try {
                    const last = decodeURIComponent(new URL(location.href).pathname.split('/').pop() || '')
                    return /\.singlebook\.html$/i.test(last) ? last : null
                } catch (_) {
                    return null
                }
            }

            function formatBytes(bytes) {
                if (!Number.isFinite(bytes) || bytes < 0) return 'unknown size'
                if (bytes < 1024) return `${bytes} B`
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`
                return `${(bytes / (1024 * 1024)).toFixed(1)} MB`
            }

            function isTextEntryTarget(target) {
                return target instanceof Element && !!target.closest('input, textarea, select, button, a, dialog, [contenteditable="true"]')
            }

            function isAllowedLink(value) {
                if (typeof value !== 'string' || value.length > 2048) return null
                if (/^#page\/[A-Za-z0-9._~%-]+$/.test(value)) return { href: value, external: false }
                if (/^mailto:[^\s<>]+$/i.test(value)) return { href: value, external: true }
                try {
                    const url = new URL(value)
                    if (url.protocol === 'http:' || url.protocol === 'https:') {
                        return { href: url.href, external: true }
                    }
                } catch (_) {}
                return null
            }

            function appendChildren(parent, children) {
                for (const child of children.flat(Infinity)) {
                    if (child === null || child === undefined || child === false) continue
                    parent.append(child instanceof Node ? child : document.createTextNode(String(child)))
                }
                return parent
            }

            function element(tag, attributes = {}, ...children) {
                const node = document.createElement(tag)
                for (const [name, value] of Object.entries(attributes || {})) {
                    if (value === null || value === undefined || value === false) continue
                    if (name === 'className') node.className = value
                    else if (name === 'text') node.textContent = value
                    else if (name === 'htmlFor') node.htmlFor = value
                    else if (name === 'dataset') Object.assign(node.dataset, value)
                    else if (name === 'style' && isPlainObject(value)) Object.assign(node.style, value)
                    else if (name.startsWith('on') && typeof value === 'function') node.addEventListener(name.slice(2).toLowerCase(), value)
                    else if (name in node && !name.startsWith('aria-') && !name.startsWith('data-')) node[name] = value
                    else node.setAttribute(name, value === true ? '' : String(value))
                }
                return appendChildren(node, children)
            }

            function saveIcon() {
                const namespace = 'http://www.w3.org/2000/svg'
                const svg = document.createElementNS(namespace, 'svg')
                svg.setAttribute('class', 'save-icon')
                svg.setAttribute('viewBox', '0 0 24 24')
                svg.setAttribute('fill', 'none')
                svg.setAttribute('stroke', 'currentColor')
                svg.setAttribute('stroke-width', '1.8')
                svg.setAttribute('stroke-linecap', 'round')
                svg.setAttribute('stroke-linejoin', 'round')
                svg.setAttribute('focusable', 'false')
                svg.setAttribute('aria-hidden', 'true')
                for (const data of ['M4 3h11l5 5v13H4z', 'M7 3v6h9V4', 'M8 14h8v7H8z']) {
                    const path = document.createElementNS(namespace, 'path')
                    path.setAttribute('d', data)
                    svg.append(path)
                }
                return svg
            }

            function replaceContents(node, ...children) {
                node.replaceChildren()
                appendChildren(node, children)
                return node
            }

            function focusMain() {
                requestAnimationFrame(() => {
                    const target = app.querySelector('h1, [data-main-heading]') || app
                    if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1')
                    target.focus({ preventScroll: true })
                })
            }

            function announce(message, tone = 'neutral', speak = true) {
                if (speak && liveStatus) {
                    liveStatus.textContent = ''
                    requestAnimationFrame(() => { liveStatus.textContent = message })
                }
                const status = document.getElementById('save-status')
                if (status) {
                    status.textContent = message
                    status.dataset.tone = tone
                    status.title = message
                }
            }

            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text))
                }
                return Promise.resolve(fallbackCopy(text))
            }

            function fallbackCopy(text) {
                const area = element('textarea', { value: text, className: 'visually-hidden', 'data-singlebook-transient': 'true' })
                document.body.append(area)
                area.select()
                try { document.execCommand('copy') } finally { area.remove() }
            }

            function readEmbeddedDocument() {
                const block = document.getElementById(DATA_BLOCK_ID)
                if (!block) throw new Error('The document data block is missing.')
                rawEmbeddedText = (block.textContent || '').trim()
                if (!rawEmbeddedText) throw new Error('The document data block is empty.')
                try {
                    return JSON.parse(rawEmbeddedText)
                } catch (error) {
                    throw new Error(`The document JSON could not be read: ${error.message}`)
                }
            }

            function stringOr(value, fallback = '') {
                return typeof value === 'string' ? value : fallback
            }

            function normalizeDocument(input) {
                if (!isPlainObject(input)) throw new Error('The document root must be a JSON object.')
                if (input.format !== FORMAT) throw new Error(`This file is not a ${FORMAT} document.`)
                if (!Number.isInteger(input.version)) throw new Error('The document version is missing or invalid.')
                if (input.version > FORMAT_VERSION) {
                    throw new Error(`This book uses format version ${input.version}, but this editor supports version ${FORMAT_VERSION}. Open it with a newer singlebook editor.`)
                }

                const doc = deepClone(input)
                const warnings = []
                doc.id = stringOr(doc.id) || createId('book')
                doc.book = isPlainObject(doc.book) ? doc.book : {}
                const book = doc.book
                book.title = stringOr(book.title, 'Untitled book')
                book.subtitle = stringOr(book.subtitle)
                book.author = stringOr(book.author)
                book.language = isLanguageTag(book.language) ? book.language : 'en'
                book.description = stringOr(book.description)
                book.coverAsset = stringOr(book.coverAsset)
                book.coverAlt = stringOr(book.coverAlt)
                book.coverDecorative = book.coverDecorative === true
                book.theme = book.theme === 'paper' ? 'paper' : 'paper'
                book.accent = isHexColor(book.accent) ? book.accent : '#9b3a32'
                book.createdAt = stringOr(book.createdAt) || nowISO()
                book.updatedAt = stringOr(book.updatedAt) || book.createdAt

                if (!Array.isArray(doc.pages)) throw new Error('The document pages must be an array.')
                const ids = new Set()
                doc.pages = doc.pages.map((source, index) => {
                    if (!isPlainObject(source)) throw new Error(`Page ${index + 1} must be an object.`)
                    const page = deepClone(source)
                    if (typeof page.id !== 'string' || !page.id) throw new Error(`Page ${index + 1} has no stable ID.`)
                    if (ids.has(page.id)) throw new Error(`Two pages use the ID “${page.id}”.`)
                    ids.add(page.id)
                    if (!['text', 'section', 'picture'].includes(page.type)) {
                        throw new Error(`Page “${page.id}” has unsupported type “${String(page.type)}”.`)
                    }
                    page.title = stringOr(page.title, 'Untitled page')
                    if (page.type === 'text') page.markdown = stringOr(page.markdown)
                    if (page.type === 'section') page.subtitle = stringOr(page.subtitle)
                    if (page.type === 'picture') {
                        page.asset = stringOr(page.asset)
                        page.alt = stringOr(page.alt)
                        page.caption = stringOr(page.caption)
                        page.decorative = page.decorative === true
                        page.fit = page.fit === 'cover' ? 'cover' : 'contain'
                    }
                    return page
                })

                if (doc.pages.length === 0) {
                    doc.pages.push({ id: createId('page'), type: 'text', title: 'Untitled page', markdown: '' })
                    warnings.push('The book contained no pages, so a blank text page was added in memory.')
                }

                doc.assets = isPlainObject(doc.assets) ? doc.assets : {}
                for (const [id, asset] of Object.entries(doc.assets)) {
                    if (!isSafeAsset(asset)) warnings.push(`Asset “${id}” is invalid and will not be displayed.`)
                }
                if (book.coverAsset && !isSafeAsset(doc.assets[book.coverAsset])) {
                    warnings.push('The cover references a missing or invalid image.')
                }
                return { document: doc, warnings }
            }

            function currentPage() {
                return state.document.pages.find(page => page.id === state.ui.selectedPageId) || null
            }

            function pageIndex(pageId) {
                return state.document.pages.findIndex(page => page.id === pageId)
            }

            function markChanged() {
                state.document.book.updatedAt = nowISO()
                state.persistence.revision += 1
                state.persistence.error = ''
                state.persistence.message = ''
                state.persistence.messageTone = ''
                refreshSaveStatus(false)
            }

            function changeBook(patch) {
                Object.assign(state.document.book, patch)
                markChanged()
            }

            function editPage(pageId, patch) {
                const page = state.document.pages.find(candidate => candidate.id === pageId)
                if (!page) return false
                Object.assign(page, patch)
                markChanged()
                return true
            }

            function addPage(type, afterPageId) {
                let page
                if (type === 'section') page = { id: createId('page'), type, title: 'New section', subtitle: '' }
                else if (type === 'picture') page = { id: createId('page'), type, title: 'New picture', asset: '', alt: '', caption: '', decorative: false, fit: 'contain' }
                else page = { id: createId('page'), type: 'text', title: 'Untitled page', markdown: '' }
                const after = pageIndex(afterPageId)
                const insertAt = after >= 0 ? after + 1 : state.document.pages.length
                state.document.pages.splice(insertAt, 0, page)
                state.ui.selectedPageId = page.id
                markChanged()
                return page
            }

            function movePage(pageId, direction) {
                const from = pageIndex(pageId)
                const to = from + direction
                if (from < 0 || to < 0 || to >= state.document.pages.length) return false
                const [page] = state.document.pages.splice(from, 1)
                state.document.pages.splice(to, 0, page)
                markChanged()
                return true
            }

            function deletePage(pageId) {
                const index = pageIndex(pageId)
                if (index < 0) return false
                if (state.document.pages.length === 1) {
                    const only = state.document.pages[0]
                    state.document.pages[0] = { id: only.id, type: 'text', title: 'Untitled page', markdown: '' }
                    state.ui.selectedPageId = only.id
                } else {
                    state.document.pages.splice(index, 1)
                    state.ui.selectedPageId = state.document.pages[Math.min(index, state.document.pages.length - 1)].id
                }
                markChanged()
                return true
            }

            function applyTheme() {
                const accent = isHexColor(state.document.book.accent) ? state.document.book.accent : '#9b3a32'
                document.documentElement.style.setProperty('--accent', accent)
                document.documentElement.lang = state.document.book.language
                document.title = `${state.document.book.title || 'Untitled'} — singlebook`
            }

            function isDirty() {
                const persistence = state.persistence
                // Persisted means written to an approved file or emitted as an updated download.
                return persistence.revision !== persistence.persistedRevision
            }

            function refreshSaveControls() {
                if (!state) return
                for (const button of document.querySelectorAll('[data-save-action]')) {
                    button.title = saveTooltip()
                    button.disabled = state.persistence.saving
                    if (state.persistence.saving) button.setAttribute('aria-busy', 'true')
                    else button.removeAttribute('aria-busy')
                }
            }

            function refreshSaveStatus(speak = false) {
                if (!state) return
                const persistence = state.persistence
                refreshSaveControls()
                if (persistence.saving) return announce('Saving…', 'dirty', speak)
                if (persistence.error) return announce(persistence.error, 'error', speak)
                if (persistence.message) return announce(persistence.message, persistence.messageTone || 'neutral', speak)
                if (isDirty()) return announce('Unsaved changes', 'dirty', speak)
                announce('No unsaved changes', 'neutral', speak)
            }

            // 04. Markdown tokenizer and renderer
            function isBlockStart(line) {
                return /^```/.test(line) || /^#{1,4}\s+/.test(line) || /^\s{0,3}(?:[-*_]\s*){3,}$/.test(line) || /^>\s?/.test(line) || /^\s{0,4}(?:[-+*]|\d+[.)])\s+/.test(line)
            }

            function appendInline(parent, source, doc) {
                let index = 0
                let buffer = ''
                const flush = () => {
                    if (buffer) parent.append(document.createTextNode(buffer))
                    buffer = ''
                }
                const addFormatted = (tag, content) => {
                    flush()
                    const child = element(tag)
                    appendInline(child, content, doc)
                    parent.append(child)
                }

                while (index < source.length) {
                    const char = source[index]
                    if (char === '\\' && index + 1 < source.length) {
                        buffer += source[index + 1]
                        index += 2
                        continue
                    }

                    if (char === '`') {
                        const close = source.indexOf('`', index + 1)
                        if (close > index + 1) {
                            flush()
                            parent.append(element('code', { text: source.slice(index + 1, close) }))
                            index = close + 1
                            continue
                        }
                    }

                    if (source.startsWith('![', index)) {
                        const altEnd = source.indexOf('](', index + 2)
                        const end = altEnd >= 0 ? source.indexOf(')', altEnd + 2) : -1
                        if (altEnd >= 0 && end >= 0) {
                            const alt = source.slice(index + 2, altEnd)
                            const target = source.slice(altEnd + 2, end)
                            const match = /^asset:([A-Za-z0-9._~-]+)$/.exec(target)
                            if (match) {
                                flush()
                                const asset = doc.assets[match[1]]
                                if (isSafeAsset(asset)) {
                                    parent.append(element('img', { src: asset.data, alt, loading: 'lazy' }))
                                } else {
                                    parent.append(element('span', { className: 'missing-asset', text: `Missing image: ${alt || match[1]}` }))
                                }
                                index = end + 1
                                continue
                            }
                        }
                    }

                    if (char === '[') {
                        const labelEnd = source.indexOf('](', index + 1)
                        const end = labelEnd >= 0 ? source.indexOf(')', labelEnd + 2) : -1
                        if (labelEnd >= 0 && end >= 0) {
                            const label = source.slice(index + 1, labelEnd)
                            const target = source.slice(labelEnd + 2, end)
                            const allowed = isAllowedLink(target)
                            if (allowed) {
                                flush()
                                const link = element('a', { href: allowed.href })
                                if (allowed.external) {
                                    link.target = '_blank'
                                    link.rel = 'noopener noreferrer'
                                }
                                appendInline(link, label, doc)
                                parent.append(link)
                                index = end + 1
                                continue
                            }
                        }
                    }

                    const strong = source.startsWith('**', index) ? '**' : source.startsWith('__', index) ? '__' : null
                    if (strong) {
                        const close = source.indexOf(strong, index + 2)
                        if (close > index + 2) {
                            addFormatted('strong', source.slice(index + 2, close))
                            index = close + 2
                            continue
                        }
                    }

                    if (source.startsWith('~~', index)) {
                        const close = source.indexOf('~~', index + 2)
                        if (close > index + 2) {
                            addFormatted('s', source.slice(index + 2, close))
                            index = close + 2
                            continue
                        }
                    }

                    if (char === '*' || char === '_') {
                        const close = source.indexOf(char, index + 1)
                        if (close > index + 1) {
                            addFormatted('em', source.slice(index + 1, close))
                            index = close + 1
                            continue
                        }
                    }

                    if (char === '\n') {
                        const hardBreak = index >= 2 && source.slice(index - 2, index) === '  '
                        if (hardBreak) {
                            buffer = buffer.replace(/ {2}$/, '')
                            flush()
                            parent.append(element('br'))
                        } else {
                            buffer += ' '
                        }
                        index += 1
                        continue
                    }

                    buffer += char
                    index += 1
                }
                flush()
                return parent
            }

            function renderMarkdown(markdown, doc) {
                const fragment = document.createDocumentFragment()
                const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n')
                let index = 0

                while (index < lines.length) {
                    const line = lines[index]
                    if (!line.trim()) {
                        index += 1
                        continue
                    }

                    const fence = /^```([A-Za-z0-9_-]{0,30})\s*$/.exec(line)
                    if (fence) {
                        index += 1
                        const code = []
                        while (index < lines.length && !/^```\s*$/.test(lines[index])) {
                            code.push(lines[index])
                            index += 1
                        }
                        if (index < lines.length) index += 1
                        const codeNode = element('code', { text: code.join('\n') })
                        if (fence[1]) codeNode.className = `language-${fence[1]}`
                        fragment.append(element('pre', {}, codeNode))
                        continue
                    }

                    const heading = /^(#{1,4})\s+(.+)$/.exec(line)
                    if (heading) {
                        const node = element(`h${Math.min(heading[1].length + 1, 5)}`)
                        appendInline(node, heading[2], doc)
                        fragment.append(node)
                        index += 1
                        continue
                    }

                    if (/^\s{0,3}(?:[-*_]\s*){3,}$/.test(line)) {
                        fragment.append(element('hr'))
                        index += 1
                        continue
                    }

                    if (/^>\s?/.test(line)) {
                        const quoteLines = []
                        while (index < lines.length && /^>\s?/.test(lines[index])) {
                            quoteLines.push(lines[index].replace(/^>\s?/, ''))
                            index += 1
                        }
                        const quote = element('blockquote')
                        quote.append(renderMarkdown(quoteLines.join('\n'), doc))
                        fragment.append(quote)
                        continue
                    }

                    const firstList = /^(\s{0,4})([-+*]|\d+[.)])\s+(.+)$/.exec(line)
                    if (firstList) {
                        const ordered = /^\d/.test(firstList[2])
                        const list = element(ordered ? 'ol' : 'ul')
                        let lastItem = null
                        while (index < lines.length) {
                            const itemMatch = /^(\s{0,4})([-+*]|\d+[.)])\s+(.+)$/.exec(lines[index])
                            if (!itemMatch) break
                            const itemOrdered = /^\d/.test(itemMatch[2])
                            const nested = itemMatch[1].length >= 2
                            if (!nested && itemOrdered !== ordered) break
                            const item = element('li')
                            appendInline(item, itemMatch[3], doc)
                            if (nested && lastItem) {
                                let nestedList = lastItem.lastElementChild
                                const nestedTag = itemOrdered ? 'OL' : 'UL'
                                if (!nestedList || nestedList.tagName !== nestedTag) {
                                    nestedList = element(itemOrdered ? 'ol' : 'ul')
                                    lastItem.append(nestedList)
                                }
                                nestedList.append(item)
                            } else {
                                list.append(item)
                                lastItem = item
                            }
                            index += 1
                        }
                        fragment.append(list)
                        continue
                    }

                    const paragraphLines = [line]
                    index += 1
                    while (index < lines.length && lines[index].trim() && !isBlockStart(lines[index])) {
                        paragraphLines.push(lines[index])
                        index += 1
                    }
                    const paragraph = element('p')
                    appendInline(paragraph, paragraphLines.join('\n'), doc)
                    fragment.append(paragraph)
                }
                return fragment
            }

            function assetFor(id, doc = state.document) {
                const asset = id ? doc.assets[id] : null
                return isSafeAsset(asset) ? asset : null
            }

            function renderMissingAsset(label) {
                return element('div', { className: 'missing-asset', text: label || 'This image is missing.' })
            }

            function renderCover(doc) {
                const book = doc.book
                const asset = assetFor(book.coverAsset, doc)
                const cover = element('section', { className: `book-cover${asset ? ' has-art' : ''}`, 'aria-labelledby': 'cover-title' })
                if (asset) cover.append(element('img', {
                    className: 'cover-art', src: asset.data,
                    alt: book.coverDecorative ? '' : book.coverAlt,
                    'aria-hidden': book.coverDecorative ? 'true' : null
                }))
                const copy = element('div', { className: 'cover-copy' })
                copy.append(element('h1', { className: 'cover-title', id: 'cover-title', text: book.title || 'Untitled book' }))
                if (book.subtitle) copy.append(element('p', { className: 'cover-subtitle', text: book.subtitle }))
                if (book.author) copy.append(element('p', { className: 'cover-author', text: `By ${book.author}` }))
                if (book.description) copy.append(element('p', { className: 'cover-description', text: book.description }))
                const first = doc.pages[0]
                const actions = element('div', { className: 'cover-actions' })
                if (first) actions.append(element('button', { className: 'primary', text: 'Start reading', onclick: () => navigate(`#page/${encodeURIComponent(first.id)}`) }))
                actions.append(element('button', { text: 'Contents', onclick: () => navigate('#contents') }))
                copy.append(actions)
                cover.append(copy)
                return cover
            }

            function renderContents(doc) {
                const section = element('section', { className: 'reader-surface', 'aria-labelledby': 'contents-title' })
                section.append(element('h1', { id: 'contents-title', className: 'contents-heading', text: 'Contents' }))
                const list = element('ol', { className: 'contents-list' })
                let number = 0
                for (const page of doc.pages) {
                    if (page.type !== 'section') number += 1
                    const item = element('li', { className: `contents-item ${page.type}` })
                    const link = element('a', { className: 'contents-link', href: `#page/${encodeURIComponent(page.id)}` })
                    link.append(
                        element('span', { className: 'contents-number', text: page.type === 'section' ? '' : String(number).padStart(2, '0') }),
                        element('span', { className: 'contents-name', text: page.title || 'Untitled page' }),
                        element('span', { className: 'contents-kind', text: page.type })
                    )
                    item.append(link)
                    list.append(item)
                }
                section.append(list)
                return section
            }

            function renderPageContent(page, doc, options = {}) {
                if (page.type === 'section') {
                    const section = element('article', { className: 'section-page', dataset: { pageId: page.id } })
                    section.append(element(options.preview ? 'h2' : 'h1', { text: page.title || 'Untitled section' }))
                    if (page.subtitle) section.append(element('p', { text: page.subtitle }))
                    return section
                }

                if (page.type === 'picture') {
                    const article = element('article', { className: 'picture-page', dataset: { pageId: page.id } })
                    article.append(element(options.preview ? 'h2' : 'h1', { className: 'page-title', text: page.title || 'Untitled picture' }))
                    const asset = assetFor(page.asset, doc)
                    if (!asset) {
                        article.append(renderMissingAsset(page.asset ? `Missing image: ${page.asset}` : 'Choose an image in Edit mode.'))
                    } else {
                        const figure = element('figure')
                        figure.append(element('img', {
                            src: asset.data,
                            alt: page.decorative ? '' : page.alt,
                            'aria-hidden': page.decorative ? 'true' : null,
                            dataset: { fit: page.fit || 'contain' }
                        }))
                        if (page.caption) figure.append(element('figcaption', { text: page.caption }))
                        article.append(figure)
                    }
                    return article
                }

                const article = element('article', { className: 'book-page prose', dataset: { pageId: page.id } })
                article.append(element(options.preview ? 'h2' : 'h1', { className: 'page-title', text: page.title || 'Untitled page' }))
                article.append(renderMarkdown(page.markdown, doc))
                return article
            }

            function readerHeader() {
                const title = element('div', { className: 'app-title', text: state.document.book.title || 'Untitled book' })
                const actions = element('div', { className: 'header-actions' })
                actions.append(
                    element('button', { className: 'quiet', text: 'Cover', onclick: () => navigate('#cover') }),
                    element('button', { className: 'quiet', text: 'Contents', onclick: () => navigate('#contents') }),
                    saveButton(),
                    element('button', { className: 'primary', text: 'Edit', onclick: enterEditMode, 'aria-label': 'Edit this copy of the book' })
                )
                return element('header', { className: 'app-header' }, title, saveStatusElement(), actions)
            }

            function pageNavigation(page) {
                const index = pageIndex(page.id)
                const previous = index > 0 ? state.document.pages[index - 1] : null
                const next = index < state.document.pages.length - 1 ? state.document.pages[index + 1] : null
                const nav = element('nav', { className: 'page-navigation', 'aria-label': 'Page navigation' })
                nav.append(
                    previous ? element('a', { className: 'previous', href: `#page/${encodeURIComponent(previous.id)}`, text: `← ${previous.title}` }) : element('span'),
                    element('a', { className: 'contents', href: '#contents', text: 'Contents' }),
                    next ? element('a', { className: 'next', href: `#page/${encodeURIComponent(next.id)}`, text: `${next.title} →` }) : element('a', { className: 'next', href: '#cover', text: 'Return to cover ↑' })
                )
                return nav
            }

            function parseRoute() {
                const hash = location.hash || '#cover'
                if (hash === '#cover') return { kind: 'cover' }
                if (hash === '#contents') return { kind: 'contents' }
                if (hash.startsWith('#page/')) {
                    try { return { kind: 'page', id: decodeURIComponent(hash.slice(6)) } }
                    catch (_) { return { kind: 'contents', invalid: true } }
                }
                return { kind: 'contents', invalid: true }
            }

            function navigate(hash) {
                if (location.hash === hash) {
                    if (state.ui.mode === 'reader') renderReader()
                } else {
                    location.hash = hash
                }
            }

            function renderReader() {
                state.ui.mode = 'reader'
                const route = parseRoute()
                const main = element('div', { className: 'reader-main' })
                if (route.kind === 'cover') {
                    main.append(renderCover(state.document))
                } else if (route.kind === 'contents') {
                    main.append(renderContents(state.document))
                    if (route.invalid) requestAnimationFrame(() => announce('That page was not found. Showing Contents.', 'error'))
                } else {
                    const page = state.document.pages.find(candidate => candidate.id === route.id)
                    if (!page) {
                        main.append(renderContents(state.document))
                        requestAnimationFrame(() => announce('That page was not found. Showing Contents.', 'error'))
                    } else {
                        const surface = element('div', { className: 'reader-surface' })
                        surface.append(renderPageContent(page, state.document))
                        main.append(surface, pageNavigation(page))
                        state.ui.selectedPageId = page.id
                    }
                }
                replaceContents(app, readerHeader(), main)
                requestAnimationFrame(() => refreshSaveStatus(false))
            }

            function navigateRelative(direction) {
                const route = parseRoute()
                if (route.kind !== 'page') {
                    if (direction > 0 && state.document.pages[0]) navigate(`#page/${encodeURIComponent(state.document.pages[0].id)}`)
                    return
                }
                const index = pageIndex(route.id)
                const target = state.document.pages[index + direction]
                if (target) {
                    navigate(`#page/${encodeURIComponent(target.id)}`)
                    return
                }
                if (direction < 0 && index === 0) navigate('#cover')
            }

            function closeAndRemoveDialog(dialog, returnFocus) {
                if (dialog.open) dialog.close()
                dialog.remove()
                if (returnFocus && returnFocus.isConnected) returnFocus.focus()
            }

            function confirmAction({ title, message, confirmLabel = 'Confirm', danger = false, opener, onConfirm }) {
                const dialog = element('dialog', { 'data-singlebook-transient': 'true', 'aria-labelledby': createId('dialog-title') })
                const headingId = dialog.getAttribute('aria-labelledby')
                const body = element('div', { className: 'dialog-body' },
                    element('h2', { id: headingId, text: title }),
                    element('p', { text: message })
                )
                const cancel = element('button', { text: 'Cancel' })
                const confirm = element('button', { className: danger ? 'danger primary' : 'primary', text: confirmLabel })
                const actions = element('div', { className: 'dialog-actions' }, cancel, confirm)
                dialog.append(body, actions)
                document.body.append(dialog)
                cancel.addEventListener('click', () => closeAndRemoveDialog(dialog, opener))
                confirm.addEventListener('click', () => {
                    closeAndRemoveDialog(dialog, null)
                    onConfirm()
                })
                dialog.addEventListener('cancel', event => {
                    event.preventDefault()
                    closeAndRemoveDialog(dialog, opener)
                })
                dialog.showModal()
                cancel.focus()
            }

            function showAddPageDialog(opener) {
                const dialog = element('dialog', { 'data-singlebook-transient': 'true' })
                const headingId = createId('dialog-title')
                dialog.setAttribute('aria-labelledby', headingId)
                const choices = element('div', { className: 'page-type-choices' })
                const definitions = [
                    ['text', 'Text page', 'Long-form writing in the supported Markdown subset.'],
                    ['section', 'Section page', 'A visual divider for a part, chapter, or short statement.'],
                    ['picture', 'Picture page', 'One large embedded image with alt text and an optional caption.']
                ]
                for (const [type, label, description] of definitions) {
                    const choice = element('button', { className: 'page-type-choice' },
                        element('span', { text: label }), element('small', { text: description })
                    )
                    choice.addEventListener('click', () => {
                        const page = addPage(type, state.ui.selectedPageId)
                        closeAndRemoveDialog(dialog, null)
                        renderEditor()
                        requestAnimationFrame(() => document.querySelector(`[data-editor-title="${CSS.escape(page.id)}"]`)?.focus())
                        announce(`${label} added.`, 'saved')
                    })
                    choices.append(choice)
                }
                const cancel = element('button', { text: 'Cancel' })
                cancel.addEventListener('click', () => closeAndRemoveDialog(dialog, opener))
                dialog.append(
                    element('div', { className: 'dialog-body' }, element('h2', { id: headingId, text: 'Add a page' }), choices),
                    element('div', { className: 'dialog-actions' }, cancel)
                )
                dialog.addEventListener('cancel', event => {
                    event.preventDefault()
                    closeAndRemoveDialog(dialog, opener)
                })
                document.body.append(dialog)
                dialog.showModal()
                choices.querySelector('button')?.focus()
            }

            function saveStatusElement() {
                return element('span', { id: 'save-status', className: 'save-status', text: 'No unsaved changes', 'aria-live': 'off' })
            }

            function saveButton(options = {}) {
                const button = element('button', {
                    type: 'button',
                    className: `save-button${options.primary ? ' primary' : ''}`,
                    title: saveTooltip(),
                    'data-save-action': 'true',
                    onclick: saveDocument
                })
                button.append(saveIcon(), element('span', { text: 'Save' }))
                return button
            }

            function noticeIfCannotWriteInPlace() {
                if (canWriteInPlace() || hasAcknowledgedSaveNotice()) return
                if (document.getElementById('singlebook-save-notice')) return
                const banner = element('div', {
                    id: 'singlebook-save-notice',
                    className: 'save-capability-banner',
                    role: 'status',
                    'aria-live': 'polite',
                    'aria-atomic': 'true',
                    'data-singlebook-transient': 'true'
                })
                const message = element('span', {
                    text: `This browser can’t rewrite files in place. ${saveShortcutLabel()} will download an updated copy instead — the file you have open will not be changed.`
                })
                const dismiss = element('button', {
                    type: 'button',
                    className: 'primary',
                    text: 'Got it',
                    onclick: () => {
                        acknowledgeSaveNotice()
                        banner.remove()
                    }
                })
                banner.append(message, dismiss)
                document.body.append(banner)
            }

            function editorHeader() {
                const menu = element('button', {
                    className: 'quiet mobile-only', text: 'Pages',
                    'aria-expanded': state.ui.railOpen ? 'true' : 'false',
                    onclick: () => {
                        state.ui.railOpen = !state.ui.railOpen
                        document.querySelector('.page-rail')?.classList.toggle('open', state.ui.railOpen)
                        menu.setAttribute('aria-expanded', state.ui.railOpen ? 'true' : 'false')
                    }
                })
                const title = element('div', { className: 'app-title', text: state.document.book.title || 'Untitled book' })
                const settings = element('button', {
                    text: 'Book settings', onclick: () => {
                        state.ui.selectedPageId = null
                        state.ui.railOpen = false
                        renderEditor()
                    }
                })
                const reader = element('button', { text: 'Reader', onclick: leaveEditMode })
                const actions = element('div', { className: 'header-actions' }, reader, settings, saveButton({ primary: true }))
                return element('header', { className: 'app-header editor-header' }, menu, title, saveStatusElement(), actions)
            }

            function railType(page) {
                return page.type === 'section' ? '§' : page.type === 'picture' ? '▧' : '¶'
            }

            function renderPageRail() {
                const rail = element('aside', { className: `page-rail${state.ui.railOpen ? ' open' : ''}`, 'aria-label': 'Book pages' })
                const heading = element('div', { className: 'rail-heading' }, element('h2', { text: 'Pages' }))
                rail.append(heading)
                const list = element('ol', { className: 'rail-list' })

                const coverRow = element('li', { className: `rail-row${state.ui.selectedPageId === null ? ' selected' : ''}` })
                const coverSelect = element('button', { className: 'rail-select', 'aria-current': state.ui.selectedPageId === null ? 'page' : null },
                    element('span', { className: 'rail-type', text: '⌂' }), element('span', { className: 'rail-name', text: 'Cover & book' })
                )
                coverSelect.addEventListener('click', () => {
                    state.ui.selectedPageId = null
                    state.ui.railOpen = false
                    renderEditor()
                })
                coverRow.append(coverSelect)
                list.append(coverRow)

                state.document.pages.forEach((page, index) => {
                    const selected = state.ui.selectedPageId === page.id
                    const row = element('li', { className: `rail-row${selected ? ' selected' : ''}` })
                    const select = element('button', { className: 'rail-select', 'aria-current': selected ? 'page' : null },
                        element('span', { className: 'rail-type', text: railType(page), title: page.type }),
                        element('span', { className: 'rail-name', text: page.title || 'Untitled page', dataset: { pageLabel: page.id } })
                    )
                    select.addEventListener('click', () => {
                        state.ui.selectedPageId = page.id
                        state.ui.railOpen = false
                        renderEditor()
                    })
                    const moves = element('div', { className: 'rail-move' })
                    const up = element('button', { text: '↑', title: `Move ${page.title} up`, 'aria-label': `Move ${page.title} up`, disabled: index === 0 })
                    const down = element('button', { text: '↓', title: `Move ${page.title} down`, 'aria-label': `Move ${page.title} down`, disabled: index === state.document.pages.length - 1 })
                    up.addEventListener('click', () => { if (movePage(page.id, -1)) { renderEditor(); announce(`${page.title} moved up.`, 'saved') } })
                    down.addEventListener('click', () => { if (movePage(page.id, 1)) { renderEditor(); announce(`${page.title} moved down.`, 'saved') } })
                    moves.append(up, down)
                    row.append(select, moves)
                    list.append(row)
                })
                rail.append(list)
                const add = element('button', { className: 'add-page-button', text: '+ Add page' })
                add.addEventListener('click', () => showAddPageDialog(add))
                rail.append(add)
                return rail
            }

            function labeledField(labelText, control, hint = '') {
                if (!control.id) control.id = createId('field')
                const field = element('div', { className: 'field' }, element('label', { htmlFor: control.id, text: labelText }), control)
                if (hint) field.append(element('p', { className: 'field-hint', text: hint }))
                return field
            }

            function panelHeader(title, page) {
                const header = element('div', { className: 'editor-panel-header' })
                header.append(element('h1', { text: title, 'data-main-heading': 'true' }))
                if (page) {
                    const actions = element('div', { className: 'page-actions' })
                    const remove = element('button', { className: 'danger', text: 'Delete page' })
                    remove.addEventListener('click', () => confirmAction({
                        title: 'Delete this page?',
                        message: `“${page.title || 'Untitled page'}” will be removed from this copy of the book.`,
                        confirmLabel: 'Delete page', danger: true, opener: remove,
                        onConfirm: () => {
                            deletePage(page.id)
                            renderEditor()
                            announce('Page deleted.', 'dirty')
                        }
                    }))
                    actions.append(remove)
                    header.append(actions)
                }
                return header
            }

            function updateRailLabel(page) {
                const label = document.querySelector(`[data-page-label="${CSS.escape(page.id)}"]`)
                if (label) label.textContent = page.title || 'Untitled page'
            }

            function updatePreview(preview, page) {
                const label = element('p', { className: 'preview-label', text: 'Reader preview' })
                replaceContents(preview, label, renderPageContent(page, state.document, { preview: true }))
            }

            function applyWrappedSelection(textarea, before, after = before, placeholder = 'text') {
                const start = textarea.selectionStart
                const end = textarea.selectionEnd
                const selected = textarea.value.slice(start, end) || placeholder
                textarea.setRangeText(`${before}${selected}${after}`, start, end, 'select')
                textarea.selectionStart = start + before.length
                textarea.selectionEnd = start + before.length + selected.length
                textarea.focus()
                textarea.dispatchEvent(new Event('input', { bubbles: true }))
            }

            function applyLinePrefix(textarea, prefix) {
                const start = textarea.selectionStart
                const end = textarea.selectionEnd
                const lineStart = textarea.value.lastIndexOf('\n', Math.max(0, start - 1)) + 1
                const nextBreak = textarea.value.indexOf('\n', end)
                const lineEnd = nextBreak < 0 ? textarea.value.length : nextBreak
                const selected = textarea.value.slice(lineStart, lineEnd)
                const lines = selected.split('\n').map((line, index) => `${typeof prefix === 'function' ? prefix(index) : prefix}${line}`)
                const replacement = lines.join('\n')
                textarea.setRangeText(replacement, lineStart, lineEnd, 'select')
                textarea.selectionStart = lineStart
                textarea.selectionEnd = lineStart + replacement.length
                textarea.focus()
                textarea.dispatchEvent(new Event('input', { bubbles: true }))
            }

            function markdownToolbar(textarea, page) {
                const toolbar = element('div', { className: 'markdown-toolbar', role: 'toolbar', 'aria-label': 'Markdown formatting' })
                const tools = [
                    ['Bold', 'B', () => applyWrappedSelection(textarea, '**', '**', 'bold text')],
                    ['Italic', 'I', () => applyWrappedSelection(textarea, '_', '_', 'italic text')],
                    ['Strikethrough', 'S', () => applyWrappedSelection(textarea, '~~', '~~', 'struck text')],
                    ['Inline code', '`', () => applyWrappedSelection(textarea, '`', '`', 'code')],
                    ['Heading', 'H', () => applyLinePrefix(textarea, '## ')],
                    ['Quote', '❯', () => applyLinePrefix(textarea, '> ')],
                    ['Bulleted list', '•', () => applyLinePrefix(textarea, '- ')],
                    ['Numbered list', '1.', () => applyLinePrefix(textarea, index => `${index + 1}. `)],
                    ['Link', '↗', () => {
                        const target = window.prompt('Link destination (https://, mailto:, or #page/…):', 'https://')
                        if (target === null) return
                        if (!isAllowedLink(target)) return announce('That link destination is not allowed.', 'error')
                        applyWrappedSelection(textarea, '[', `](${target})`, 'link text')
                    }],
                    ['Image', '▧', async () => {
                        const selectionStart = textarea.selectionStart
                        const selectionEnd = textarea.selectionEnd
                        const imported = await importRasterImage()
                        if (!imported) return
                        const alt = window.prompt('Describe the image for readers who cannot see it:', imported.asset.name.replace(/\.[^.]+$/, ''))
                        if (alt === null) return
                        state.document.assets[imported.id] = imported.asset
                        textarea.setSelectionRange(selectionStart, selectionEnd)
                        textarea.setRangeText(`![${alt}](asset:${imported.id})`, selectionStart, selectionEnd, 'end')
                        textarea.dispatchEvent(new Event('input', { bubbles: true }))
                        announce(`Embedded ${imported.asset.name}.`, 'dirty')
                    }]
                ]
                for (const [title, text, handler] of tools) toolbar.append(element('button', { type: 'button', title, 'aria-label': title, text, onclick: handler }))
                return toolbar
            }

            function renderTextEditor(page) {
                const panel = element('section', { className: 'editor-panel' })
                panel.append(panelHeader('Text page', page))
                const title = element('input', { type: 'text', value: page.title, dataset: { editorTitle: page.id } })
                const titleField = labeledField('Page title', title)
                const tabs = element('div', { className: 'editor-tabs', role: 'tablist', 'aria-label': 'Text page view' })
                const layout = element('div', { className: 'writing-layout', dataset: { tab: state.ui.editorTab } })
                const writeTab = element('button', { text: 'Write', role: 'tab', 'aria-selected': state.ui.editorTab === 'write' ? 'true' : 'false' })
                const previewTab = element('button', { text: 'Preview', role: 'tab', 'aria-selected': state.ui.editorTab === 'preview' ? 'true' : 'false' })
                writeTab.addEventListener('click', () => { state.ui.editorTab = 'write'; layout.dataset.tab = 'write'; writeTab.setAttribute('aria-selected', 'true'); previewTab.setAttribute('aria-selected', 'false') })
                previewTab.addEventListener('click', () => { state.ui.editorTab = 'preview'; layout.dataset.tab = 'preview'; writeTab.setAttribute('aria-selected', 'false'); previewTab.setAttribute('aria-selected', 'true') })
                tabs.append(writeTab, previewTab)

                const textarea = element('textarea', { className: 'markdown-editor', value: page.markdown, 'aria-label': `Markdown for ${page.title}`, spellcheck: true })
                const writing = element('div', { className: 'writing-pane' })
                writing.append(markdownToolbar(textarea, page), textarea)
                const preview = element('div', { className: 'preview-pane', role: 'region', 'aria-label': 'Reader preview' })
                updatePreview(preview, page)
                layout.append(writing, preview)

                title.addEventListener('input', () => {
                    editPage(page.id, { title: title.value })
                    updateRailLabel(page)
                    updatePreview(preview, page)
                })
                textarea.addEventListener('input', () => {
                    editPage(page.id, { markdown: textarea.value })
                    updatePreview(preview, page)
                })
                panel.append(titleField, tabs, layout)
                return panel
            }

            function renderSectionEditor(page) {
                const panel = element('section', { className: 'editor-panel' })
                panel.append(panelHeader('Section page', page))
                const title = element('input', { type: 'text', value: page.title, dataset: { editorTitle: page.id } })
                const subtitle = element('input', { type: 'text', value: page.subtitle })
                const preview = element('div', { className: 'preview-pane', role: 'region', 'aria-label': 'Reader preview' })
                updatePreview(preview, page)
                title.addEventListener('input', () => { editPage(page.id, { title: title.value }); updateRailLabel(page); updatePreview(preview, page) })
                subtitle.addEventListener('input', () => { editPage(page.id, { subtitle: subtitle.value }); updatePreview(preview, page) })
                panel.append(
                    element('div', { className: 'settings-card form-stack' },
                        labeledField('Section title', title),
                        labeledField('Subtitle (optional)', subtitle),
                        element('p', { className: 'field-hint', text: 'Section pages divide the book’s flat sequence; they are not folders.' })
                    ), preview
                )
                return panel
            }

            function assetDetails(asset) {
                if (!asset) return element('p', { className: 'asset-meta', text: 'No image selected.' })
                const comma = asset.data.indexOf(',')
                const bytes = comma >= 0 ? Math.floor((asset.data.length - comma - 1) * 0.75) : asset.data.length
                return element('p', { className: 'asset-meta', text: `${asset.name} · ${asset.mime} · approximately ${formatBytes(bytes)}` })
            }

            async function replacePictureAsset(page) {
                const imported = await importRasterImage()
                if (!imported) return
